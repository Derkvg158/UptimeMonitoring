<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Status van mijn websites</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #eef1f0;
    --panel: #ffffff;
    --ink: #1d2a2b;
    --muted: #6c7c7b;
    --rule: #dde3e1;
    --ok: #2e7d5b;
    --down: #b3261e;
    --warn: #b3720d;
    --idle: #cfd8d6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 20px 64px;
    background: var(--paper);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 760px; margin: 0 auto; }

  .verdict { margin-bottom: 28px; }
  .verdict h1 {
    margin: 0;
    font-size: clamp(28px, 7vw, 42px);
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  .verdict p { margin: 6px 0 0; color: var(--muted); font-size: 14px; }

  .board {
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: 6px;
  }
  .site { padding: 18px 20px; border-top: 1px solid var(--rule); }
  .site:first-child { border-top: 0; }

  .head { display: flex; align-items: baseline; gap: 10px; }
  .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--idle); flex: none;
    align-self: center;
  }
  .dot.ok { background: var(--ok); }
  .dot.down { background: var(--down); }
  .dot.warn { background: var(--warn); }
  .dot.paused { background: var(--idle); }
  .name { font-weight: 600; }
  .name a { color: inherit; text-decoration: none; }
  .name a:hover { text-decoration: underline; }
  .timing { margin-left: auto; font-size: 14px; color: var(--muted); }
  .timing.bad { color: var(--down); font-weight: 500; }

  .bars { display: flex; gap: 2px; margin: 14px 0 8px; height: 30px; align-items: stretch; }
  .bar { flex: 1 1 0; min-width: 0; border-radius: 1px; background: var(--idle); }
  .bar.ok { background: var(--ok); }
  .bar.part { background: var(--warn); }
  .bar.down { background: var(--down); }

  .meta {
    display: flex; flex-wrap: wrap; gap: 4px 18px;
    font-size: 13px; color: var(--muted);
  }
  .meta b { font-weight: 500; color: var(--ink); }
  .alert { color: var(--down); }
  .cert-warn { color: var(--warn); }

  .spark { display: block; width: 100%; height: 34px; margin: 10px 0 4px; }
  .spark path { fill: none; stroke: var(--muted); stroke-width: 1.2; vector-effect: non-scaling-stroke; }
  .spark .fail { stroke: var(--down); stroke-width: 2; }
  details.incidents { margin-top: 8px; font-size: 13px; color: var(--muted); }
  details.incidents summary { cursor: pointer; }
  details.incidents ul { margin: 6px 0 0; padding-left: 18px; }
  details.incidents li { margin: 2px 0; }

  footer { margin-top: 20px; font-size: 13px; color: var(--muted); }
  .empty { padding: 28px 20px; color: var(--muted); }
  @media (max-width: 480px) {
    .bars { height: 24px; }
    .timing { width: 100%; margin-left: 19px; }
  }
</style>
</head>
<body>
<main>
  <div class="verdict">
    <h1 id="headline">Statuspagina laden</h1>
    <p id="subhead">Even geduld.</p>
  </div>
  <div class="board" id="board"></div>
  <footer><span id="footer"></span> <a href="beheer.html" style="color:inherit">Beheer</a></footer>
</main>

<script>
const DAYS = 45;

const fmtTime = (iso) => new Date(iso).toLocaleString("nl-NL", {
  timeZone: "Europe/Amsterdam", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"
});

const sinceText = (iso) => {
  const mins = Math.round((Date.now() - Date.parse(iso)) / 60000);
  if (mins < 60) return `${mins} min`;
  if (mins < 1440) return `${Math.round(mins / 60)} uur`;
  return `${Math.round(mins / 1440)} dagen`;
};

function dayKeys(n) {
  const out = [];
  for (let i = n - 1; i >= 0; i--) {
    out.push(new Date(Date.now() - i * 86400000).toISOString().slice(0, 10));
  }
  return out;
}

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const duration = (ms) => {
  const mins = Math.max(1, Math.round(ms / 60000));
  if (mins < 60) return `${mins} min`;
  if (mins < 1440) return `${Math.floor(mins / 60)} u ${mins % 60} min`;
  return `${Math.round(mins / 1440)} dagen`;
};

// Responstijden van de laatste 24 uur als lijntje; rode streepjes zijn mislukte metingen.
function renderSpark(recent) {
  const cutoff = Date.now() - 86400000;
  const pts = (recent ?? []).filter((p) => Date.parse(p.t) >= cutoff);
  if (pts.length < 2) return "";
  const W = 300, H = 34;
  const x = (p) => ((Date.parse(p.t) - cutoff) / 86400000) * W;
  const okPts = pts.filter((p) => p.ok);
  const max = Math.max(1000, ...okPts.map((p) => p.ms));
  const y = (ms) => H - 2 - (ms / max) * (H - 6);
  const line = okPts.map((p, i) => `${i ? "L" : "M"}${x(p).toFixed(1)},${y(p.ms).toFixed(1)}`).join("");
  const fails = pts.filter((p) => !p.ok)
    .map((p) => `<path class="fail" d="M${x(p).toFixed(1)},${H - 8}V${H}"><title>${esc(fmtTime(p.t))}: ${esc(p.r ?? "mislukt")}</title></path>`).join("");
  const avg = okPts.length ? Math.round(okPts.reduce((a, p) => a + p.ms, 0) / okPts.length) : null;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Responstijd laatste 24 uur${avg ? `, gemiddeld ${avg} ms` : ""}"><path d="${line}"/>${fails}</svg>`;
}

function renderIncidents(incidents) {
  const list = (incidents ?? []).slice(-5).reverse();
  if (!list.length) return "";
  const items = list.map((i) => {
    const end = i.end ? Date.parse(i.end) : Date.now();
    const state = i.end ? duration(end - Date.parse(i.start)) : `loopt nog, ${duration(end - Date.parse(i.start))}`;
    return `<li>${esc(fmtTime(i.start))} — ${esc(state)} — ${esc(i.reason)}</li>`;
  }).join("");
  return `<details class="incidents"><summary>Laatste storingen</summary><ul>${items}</ul></details>`;
}

function renderBars(daily) {
  return dayKeys(DAYS).map((day) => {
    const d = daily?.[day];
    if (!d || !d.total) return `<div class="bar" title="${day}: niet gemeten"></div>`;
    const pct = (d.up / d.total) * 100;
    const cls = pct === 100 ? "ok" : pct >= 95 ? "part" : "down";
    return `<div class="bar ${cls}" title="${day}: ${pct.toFixed(1)}% bereikbaar"></div>`;
  }).join("");
}

async function load() {
  let status;
  try {
    status = await (await fetch("./status.json?" + Date.now())).json();
  } catch {
    document.getElementById("headline").textContent = "Nog geen metingen";
    document.getElementById("subhead").textContent = "De eerste controle draait binnen een paar minuten. Start hem desnoods handmatig via het tabblad Actions.";
    document.getElementById("board").innerHTML = '<div class="empty">Zodra de workflow een keer gedraaid heeft, staan je sites hier.</div>';
    return;
  }

  if (status.title) document.title = status.title;
  const monitors = status.monitors ?? [];
  const down = monitors.filter((m) => !m.ok && !m.paused);
  const slow = monitors.filter((m) => m.ok && m.slow && !m.paused);
  const head = document.getElementById("headline");

  if (down.length) {
    head.textContent = down.length === 1 ? `${down[0].name} is onbereikbaar` : `${down.length} sites onbereikbaar`;
    head.style.color = "var(--down)";
  } else if (slow.length) {
    head.textContent = "Alles bereikbaar, iets traag";
  } else {
    head.textContent = "Alles draait";
  }
  document.getElementById("subhead").textContent = `Laatst gecontroleerd ${fmtTime(status.generated)}`;

  const histories = await Promise.all(monitors.map(async (m) => {
    try { return await (await fetch(`./history/${m.slug}.json?` + Date.now())).json(); }
    catch { return {}; }
  }));

  document.getElementById("board").innerHTML = monitors.map((m, i) => {
    const dot = m.paused ? "paused" : m.ok ? (m.slow ? "warn" : "ok") : "down";
    const timing = m.paused
      ? "gepauzeerd"
      : m.ok
        ? `${m.ms} ms${m.slow ? " — traag" : ""}`
        : `${esc(m.reason ?? "onbereikbaar")} — al ${sinceText(m.since)}`;
    const up = m.uptime ?? {};
    const cert = m.cert
      ? (m.cert.daysLeft <= 14
          ? `<span class="cert-warn">certificaat verloopt over ${m.cert.daysLeft} dagen</span>`
          : `certificaat nog <b>${m.cert.daysLeft}</b> dagen geldig`)
      : "";
    return `
      <div class="site">
        <div class="head">
          <span class="dot ${dot}"></span>
          <span class="name"><a href="${esc(m.url)}" rel="noopener">${esc(m.name)}</a></span>
          <span class="timing ${m.ok || m.paused ? "" : "bad"}">${timing}</span>
        </div>
        <div class="bars">${renderBars(histories[i].daily)}</div>
        ${renderSpark(histories[i].recent)}
        <div class="meta">
          <span>24 uur <b>${up.d1 ?? "—"}%</b></span>
          <span>7 dagen <b>${up.d7 ?? "—"}%</b></span>
          <span>30 dagen <b>${up.d30 ?? "—"}%</b></span>
          ${cert ? `<span>${cert}</span>` : ""}
        </div>
        ${renderIncidents(histories[i].incidents)}
      </div>`;
  }).join("");

  document.getElementById("footer").textContent =
    `Elke balk is één dag, oudste links. Het lijntje is de responstijd van de laatste 24 uur, rode streepjes zijn mislukte metingen. Controle draait via GitHub Actions, elke 5 minuten.`;
}

load();
setInterval(load, 60000);
</script>
</body>
</html>
